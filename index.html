<style>

.big{font-size:36px;font-weight:800;text-align:center;margin:12px 0 4px;letter-spacing:-.8px;line-height:1.15}

.pvc svg{width:100%;max-width:250px;height:auto}
.pvl{font-size:12px;color:var(--dim);font-weight:600}
.pvs{font-size:13px;font-weight:600;margin-top:4px}
.pva{align-self:center;font-size:22px;color:var(--dim)}
.th{display:block;width:92px;height:57px;flex:none;object-fit:contain;background:radial-gradient(120% 120% at 50% 30%,rgba(255,255,255,.10),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:10px}
.th.nx{border-color:var(--accent)}.pvr{display:flex;align-items:center;gap:3px;flex:none}.pvr .ar{color:var(--dim);font-size:15px}

.lvg .w3{box-shadow:inset 0 -3px 0 #4cc2ff}
.lnk{background:none;border:0;color:var(--accent);font:inherit;font-size:12px;padding:6px 0 0;cursor:pointer}
.strip{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;flex:1 1 100%;scroll-snap-type:x proximity}
.st{flex:none;width:118px;scroll-snap-align:start;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:6px;color:inherit;text-align:center;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
.st img{width:100%;height:auto;border-radius:8px;background:radial-gradient(120% 120% at 50% 30%,rgba(255,255,255,.10),rgba(255,255,255,.02))}

// Sichtbares Modell = Hitbox: jedes Rezept wird mittig ausgerichtet und so skaliert, dass seine Sichtkanten (Breite, Tiefe, Höhe) genau die Kollisionsbox füllen
// (auch bei einseitigen Formen wie dem Kaktus mit nur einem Arm). Wo das Modell dafür zu stark vergrößert werden müsste, wird stattdessen die Hitbox verkleinert (OBRFIT).
const OBRFIT = OBR.map(set => set.map(() => ({ x: 1, z: 1, y: 1 })));
OBR.forEach((set, w) => set.forEach((rec, k) => {
  let x0 = 9, x1 = -9, z0 = 9, z1 = -9, my = 0; for (const p of rec) { x0 = Math.min(x0, p[0] - p[3]); x1 = Math.max(x1, p[0] + p[3]); z0 = Math.min(z0, p[2] - p[5]); z1 = Math.max(z1, p[2] + p[5]); my = Math.max(my, p[1] + p[4] / 2); }
  const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, fx = 2 / (x1 - x0), fz = 2 / (z1 - z0), fy = 1 / my, CAP = 1.6, fit = OBRFIT[w][k];
  fit.x = Math.min(1, CAP / fx); fit.z = Math.min(1, CAP / fz); fit.y = Math.min(1, CAP / fy);
  for (const p of rec) { p[0] = (p[0] - cx) * fx; p[3] *= fx; p[2] = (p[2] - cz) * fz; p[5] *= fz; p[1] *= fy; p[4] *= fy; }
}));
for (let L = 0; L < NLEV; L++) genLevel(L);

/* --- Pfad aufbauen (Float64: Koordinaten werden sehr groß) --- */
let PX, PY, PZ, PPSI, PN;
(function buildPath() {
  PN = NLEV * LEN + LEN; const K = new Float64Array(PN + 2), Gs = new Float64Array(PN + 2), sm = t => t * t * (3 - 2 * t);
  for (const lv of LV) {
    for (const c of lv.curves) for (let s = Math.ceil(c.a); s < c.a + c.len; s++) { const t = (s - c.a) / c.len, sh = t < 0.25 ? sm(t / 0.25) : t > 0.75 ? sm((1 - t) / 0.25) : 1; K[s] += c.kmax * sh; }
    for (const c of lv.climbs) for (let s = Math.ceil(c.a); s < c.a + c.len; s++) { const t = (s - c.a) / c.len; Gs[s] += c.dy / c.len * 6 * t * (1 - t); }
  }
  PX = new Float64Array(PN + 2); PY = new Float64Array(PN + 2); PZ = new Float64Array(PN + 2); PPSI = new Float64Array(PN + 2);
  let x = 0, y = 0, z = 0, psi = 0;
  for (let i = 0; i < PN + 2; i++) { PX[i] = x; PY[i] = y; PZ[i] = z; PPSI[i] = psi; psi += K[i]; x += Math.sin(psi); z += Math.cos(psi); y += Gs[i]; }
})();
const _p = { x: 0, y: 0, z: 0, psi: 0 };
function pathAt(s) { s = clamp(s, 0, PN - 1); const i = Math.floor(s), f = s - i;

    'auth/email-already-in-use': 'Für diese E-Mail gibt es schon ein Konto. Bitte anmelden.', 'auth/invalid-credential': 'E-Mail oder Passwort ist falsch.',
    'auth/wrong-password': 'E-Mail oder Passwort ist falsch.', 'auth/user-not-found': 'E-Mail oder Passwort ist falsch.', 'auth/too-many-requests': 'Zu viele Versuche. Bitte später erneut probieren.',
    'auth/popup-closed-by-user': 'Google-Anmeldung abgebrochen.', 'auth/cancelled-popup-request': 'Google-Anmeldung abgebrochen.', 'auth/network-request-failed': 'Keine Verbindung zum Server.',
    'auth/unauthorized-domain': 'Diese Domain ist in Firebase nicht freigegeben (Authentication → Einstellungen → Autorisierte Domains).',
    'permission-denied': 'Zugriff verweigert – Firestore-Regeln prüfen.', 'unavailable': 'Server nicht erreichbar – später erneut versuchen.'
  }[e && e.code] || ('Fehler: ' + ((e && (e.message || e.code)) || 'unbekannt')));
  const loadScript = src => new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => bad(new Error('Firebase konnte nicht geladen werden')); document.head.appendChild(s); });

  async function init() {
    if (!cfg) return;
    try {
      for (const f of ['firebase-app-compat.js', 'firebase-auth-compat.js', 'firebase-firestore-compat.js']) await loadScript(SDK + f);
      firebase.initializeApp(cfg); auth = firebase.auth(); db = firebase.firestore(); auth.languageCode = 'de';
      auth.getRedirectResult().catch(e => { msg = errText(e); refresh(); });
      auth.onAuthStateChanged(u => { user = u; ready = false; conflict = null; if (u) resolve(); refresh(); });
    } catch (e) { loadErr = e.message || 'Firebase konnte nicht geladen werden'; refresh(); }
  }

  // Beim Anmelden: Cloud- und lokalen Stand abgleichen
  async function resolve() {
    const u = user; busy = true; refresh();
    try {
      const snap = await docRef().get(); if (user !== u) { busy = false; return; }
      const meta = getMeta(), local = data(), sameUser = meta.uid === u.uid, localChanged = !sameUser || meta.data !== local;
      if (!snap.exists) await upload();
      else {
        const c = snap.data(), cloudChanged = !sameUser || c.rev !== meta.rev;
        if (c.data === local) { setMeta({ uid: u.uid, rev: c.rev, data: local }); lastSync = Date.now(); }
        else if (isEmpty() || (sameUser && !localChanged)) applyCloud(c);
        else if (sameUser && !cloudChanged) await upload();
        else { conflict = c; busy = false; ready = false; return showConflict(); }
      }
      ready = true;
    } catch (e) { msg = errText(e); }
    busy = false; refresh();
  }

  function applyCloud(c) {
    try {
      save = sanitizeSave(JSON.parse(c.data)); calcStats(); applyCosmetics(); applySettings();
      setMeta({ uid: user.uid, rev: c.rev, data: data() }); lastSync = Date.now();
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
      for (let L = 0; L < NLEV; L++) resetCoins(L); respawnCheckpoint(true); car.lvl = -1;
      toast('☁ Cloud-Spielstand geladen · Level ' + unlockedLevel());
    } catch (e) { msg = 'Cloud-Spielstand ist beschädigt: ' + (e.message || ''); }
  }

  async function upload() {
    if (!user) return; const d = data(), r = rev();
    await docRef().set({ data: d, rev: r, progress: save.progress, coins: save.coins, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    setMeta({ uid: user.uid, rev: r, data: d }); lastSync = Date.now();
  }

  // Wird bei jedem lokalen Speichern aufgerufen – lädt gebündelt hoch
  function queue() {
    if (!user || !ready || upT) return;
    upT = setTimeout(async () => { upT = 0; if (!user || !ready || getMeta().data === data()) return;
      try { await upload(); } catch (e) { msg = errText(e); } if (mode === 'account') render(); }, 3000);
  }

  function status() {
    if (!cfg) return '';
    if (!user) return ' · <span style="opacity:.8">Nicht angemeldet</span>';
    return ' · ☁ ' + esc(user.displayName || user.email || 'Konto');
  }

  function render() {
    mode = 'account'; let b = '';
    const m = msg ? `<div class="msg">${esc(msg)}</div>` : '';
    if (!cfg) b = `<div class="sub" style="text-align:left">Der Cloud-Speicher ist noch nicht eingerichtet. Trage deine Firebase-Konfiguration in <b>firebase-config.js</b> ein (Anleitung in README.md).</div>`;
    else if (loadErr) b = `<div class="msg">${esc(loadErr)}</div><div class="sub">Prüfe deine Internetverbindung und lade die Seite neu.</div>`;
    else if (!auth) b = '<div class="sub">Verbinde …</div>';
    else if (!user) b = `${m}<div class="sub" style="text-align:left;margin-bottom:12px">Melde dich an, um deinen Spielstand in der Cloud zu speichern und auf allen Geräten weiterzuspielen.</div>
      <input class="fld" id="acMail" type="email" autocomplete="email" placeholder="E-Mail" value="${esc(mail)}">
      <input class="fld" id="acPass" type="password" autocomplete="current-password" placeholder="Passwort (mind. 6 Zeichen)">
      <div class="acrow"><button class="btn pri" data-act="acLogin" ${busy ? 'disabled' : ''}>Anmelden</button><button class="btn" data-act="acReg" ${busy ? 'disabled' : ''}>Registrieren</button></div>
      <div class="acrow"><button class="btn" data-act="acGoogle" ${busy ? 'disabled' : ''}>Mit Google anmelden</button></div>
      <button class="lnk2" data-act="acReset">Passwort vergessen?</button>`;
    else b = `${m}<div class="sub" style="text-align:left">Angemeldet als <b>${esc(user.email || user.displayName || user.uid)}</b></div>
      <div class="sub" style="text-align:left;margin:8px 0 12px">${busy ? 'Synchronisiere …' : ready ? ('☁ Spielstand wird automatisch gespeichert' + (lastSync ? ' · zuletzt ' + new Date(lastSync).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : '')) : 'Noch nicht synchronisiert'}</div>
      <div class="acrow"><button class="btn pri" data-act="acSync" ${busy ? 'disabled' : ''}>Jetzt speichern</button><button class="btn warn" data-act="acLogout">Abmelden</button></div>`;
    showMenu(`<div class="panel"><h1>Konto</h1><div class="pbody">${b}</div><div class="pfoot"><button class="btn" data-act="acBack">Zurück</button></div></div>`);
  }

  function showConflict() {
    const c = conflict, lv = p => Math.min(NLEV, p + 1);
    mode = 'account'; showMenu(`<div class="panel"><h1>Welchen Spielstand behalten?</h1><div class="pbody">
      <div class="sub" style="text-align:left">In deinem Konto ist ein anderer Spielstand gespeichert als auf diesem Gerät.</div>
      <div class="accmp"><div><b>☁ Cloud</b><br>Level ${lv(c.progress | 0)} · ${c.coins | 0} ${coinIcon}</div><div><b>Dieses Gerät</b><br>Level ${unlockedLevel()} · ${save.coins} ${coinIcon}</div></div>
      <div class="sub" style="text-align:left">Der andere Stand wird überschrieben. Tipp: Vorher ein Backup herunterladen.</div></div>
      <div class="pfoot"><button class="btn pri" data-act="acUseCloud">Cloud-Stand laden</button><button class="btn" data-act="acUseLocal">Diesen Stand hochladen</button></div></div>`);
  }

  function refresh() { if (mode === 'account' && !conflict) render(); if (mode === 'title') showTitle(); }
  function open(from) { back = from; msg = ''; conflict ? showConflict() : render(); }
  function goBack() {
    if (conflict) return; msg = '';
    if (back === 'title') { hideMenu(); showTitle(); } else if (back === 'settings') { mode = 'settings'; showMenu(settingsHTML()); } else { hideMenu(); mode = 'play'; }
  }
  const creds = () => { const m = $('acMail'), p = $('acPass'); if (m) mail = m.value.trim(); return [mail, p ? p.value : '']; };
  async function run(fn) { busy = true; msg = ''; render(); try { await fn(); } catch (e) { msg = errText(e); } busy = false; if (!conflict) render(); }

  ov.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const a = b.dataset.act;
    if (a === 'acctFromTitle') open('title');
    else if (a === 'acctFromSet') open('settings');
    else if (a === 'acBack') goBack();
    else if (a === 'acLogin') { const [m, p] = creds(); run(() => auth.signInWithEmailAndPassword(m, p)); }
    else if (a === 'acReg') { const [m, p] = creds(); run(() => auth.createUserWithEmailAndPassword(m, p)); }
    else if (a === 'acReset') { const [m] = creds(); if (!m) { msg = 'Bitte zuerst die E-Mail-Adresse eingeben.'; return render(); }
      run(async () => { await auth.sendPasswordResetEmail(m); msg = 'E-Mail zum Zurücksetzen wurde gesendet (auch im Spam-Ordner nachsehen).'; }); }
    else if (a === 'acGoogle') run(async () => { const p = new firebase.auth.GoogleAuthProvider();
      try { await auth.signInWithPopup(p); } catch (e) { if (e && /popup-blocked|operation-not-supported/.test(e.code)) await auth.signInWithRedirect(p); else throw e; } });
    else if (a === 'acLogout') { clearTimeout(upT); upT = 0; run(async () => { if (ready && getMeta().data !== data()) await upload(); await auth.signOut(); msg = 'Abgemeldet. Der Spielstand bleibt auf diesem Gerät.'; }); }
    else if (a === 'acSync') run(async () => { clearTimeout(upT); upT = 0; if (!ready) return resolve(); await upload(); msg = 'Gespeichert.'; });
    else if (a === 'acUseCloud') { const c = conflict; conflict = null; applyCloud(c); ready = true; render(); }
    else if (a === 'acUseLocal') { conflict = null; run(async () => { await upload(); ready = true; msg = 'Spielstand hochgeladen.'; }); }
  });
  ov.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.target.id === 'acMail' || e.target.id === 'acPass')) { const btn = ov.querySelector('[data-act="acLogin"]'); if (btn) btn.click(); } });

  cloudHook = queue; init();
  return { status, back: goBack };
})();
setInterval(() => { if (dirty) saveGame(); }, 4000); addEventListener('beforeunload', saveGame);

/* =====================================================================
   START & GAME LOOP
   ===================================================================== */
/*DBG_HOOK*/
applySettings(); respawnCheckpoint(true); showTitle();
let last = performance.now(), acc = 0, titleT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode === 'play') { acc += dt; const h = 1 / 90; let n = 0; while (acc >= h && n < 8) { stepCar(h); acc -= h; n++; } if (n === 8) acc = 0; ensureLevels(false); }
  if (mode !== 'title') updateVisuals(dt);
  else { titleT += dt; const cw = toW(car.x, car.y, car.z); applyEnv(); updateParts(dt); carRoot.position.set(cw[0], cw[1], cw[2]); carRoot.rotation.y = cw[3] + car.yaw; if (save.paint === 11) bodyMat.color.setHSL((titleT * 0.3) % 1, 0.85, 0.55);
    const ang = cw[3] + 2.4 + Math.sin(titleT * 0.3) * 0.5; camPos.set(cw[0] - Math.sin(ang) * 9, cw[1] + 3.2, cw[2] - Math.cos(ang) * 9); camera.position.copy(camPos); camera.lookAt(cw[0], cw[1] + 1, cw[2]); }
  renderer.render(scene, camera); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
